[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merrick-cli"
version = "0.1.0"
description = "CLI for managing the Merrick memory daemon"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
merrick = "merrick_cli.main:main"

[tool.setuptools.packages.find]
include = ["merrick_cli*"]
